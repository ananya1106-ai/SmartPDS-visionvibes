<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartPDS — Intelligent Commodity Stock Allocation & FIFO Management</title>
    <meta name="description" content="Intelligent Public Distribution System warehouse stock allocation, strict FIFO batch dispatch engine, digital challan generation, and audit logging for civil supplies depots." />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('smartpds_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-[#0B0F17] text-[#F1F5F9] font-sans antialiased selection:bg-[#9F1745]/30 selection:text-[#C4B5FD] transition-colors duration-200">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
